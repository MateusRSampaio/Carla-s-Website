<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch about a photography project.">
  <title>Contato | Carla Cardoso Uchôa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">Carla Cardoso Uchôa</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="about.html">Sobre</a>
      <a href="contact.html" aria-current="page">Contato</a>
    </nav>
  </header>

  <main class="page-content">
    <p class="eyebrow">Fale comigo!</p>
    <div class="contact-layout">
      <div>
        <h1>Contato</h1>
        <p class="intro">Conte-me um pouco sobre o seu projeto e eu voltarei a você em breve.</p>
        <p class="intro">Você também pode me encontrar nas redes sociais: @carlauchoafotografia.</p>
      </div>
      <form class="contact-form">
        <label for="name">Nome</label>
        <input id="name" name="name" type="text" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <label for="message">Mensagem</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        <button class="button" type="submit">Envie uma mensagem</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Carla Cardoso Uchôa (@carlauchoafotografia)</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

  <title>Portfolio | Carla Cardoso Uchôa</title>

<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">Carla Cardoso Uchôa</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">

  <main class="page-content">
    <p class="eyebrow">Meus trabalhos</p>
    <h1>Portfolio</h1>
    <div class="albums">
      <article class="album-card" tabindex="0" role="button" aria-haspopup="dialog" aria-label="Abrir álbum Fotos ao ar livre">
        <div class="album-cover">
          <img src="assets/images/Carla4.jpg" alt="Carla Cardoso Uchôa smiling while holding a camera and smartphone">
          <span class="album-count">3 fotos</span>
        </div>
        <div class="album-card-info">
          <span class="album-index">01</span>
          <h2>Fotos ao ar livre</h2>
          <p>Descrição do album</p>
        </div>
        <ul class="album-photos" hidden>
          <li data-caption="Carla behind the camera"><img src="assets/images/Carla4.jpg" alt="Carla Cardoso Uchôa smiling while holding a camera and smartphone"></li>
          <li data-caption="A repeated behind-the-scenes test image"><img src="assets/images/Carla4.jpg" alt="Carla Cardoso Uchôa smiling while holding a camera and smartphone"></li>
          <li data-caption="A portrait from the creative process"><img src="assets/images/Carla1.jpg" alt="Portrait of a woman wearing a black top and white trousers"></li>
        </ul>
      </article>

      <article class="album-card" tabindex="0" role="button" aria-haspopup="dialog" aria-label="Abrir álbum Fotos de estúdio">
        <div class="album-cover">
          <img src="assets/images/Carla1.jpg" alt="Portrait of a woman wearing a black top and white trousers">
          <span class="album-count">3 fotos</span>
        </div>
        <div class="album-card-info">
          <span class="album-index">02</span>
          <h2>Fotos de estúdio</h2>
          <p>Descrição do album</p>
        </div>
        <ul class="album-photos" hidden>
          <li data-caption="Studio portrait in black and white"><img src="assets/images/Carla1.jpg" alt="Portrait of a woman wearing a black top and white trousers"></li>
          <li data-caption="Fashion portrait with a white cap"><img src="assets/images/Carla3.jpg" alt="Portrait of a woman wearing a white cap and navy top"></li>
          <li data-caption="A repeated studio test image"><img src="assets/images/Carla1.jpg" alt="Portrait of a woman wearing a black top and white trousers"></li>
        </ul>
      </article>

      <article class="album-card" tabindex="0" role="button" aria-haspopup="dialog" aria-label="Abrir álbum Eventos">
        <div class="album-cover">
          <img src="assets/images/Carla2.jpg" alt="Dancer in white clothing moving through a bright room">
          <span class="album-count">3 fotos</span>
        </div>
        <div class="album-card-info">
          <span class="album-index">03</span>
          <h2>Eventos</h2>
          <p>Descrição do album</p>
        </div>
        <ul class="album-photos" hidden>
          <li data-caption="Dancer moving through a bright room"><img src="assets/images/Carla2.jpg" alt="Dancer in white clothing moving through a bright room"></li>
          <li data-caption="A repeated movement test image"><img src="assets/images/Carla2.jpg" alt="Dancer in white clothing moving through a bright room"></li>
          <li data-caption="Portrait between movements"><img src="assets/images/Carla3.jpg" alt="Portrait of a woman wearing a white cap and navy top"></li>
        </ul>
      </article>
    </div>
  </main>

  <div class="album-viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visualizador de álbum">
    <button class="viewer-close" type="button" aria-label="Fechar álbum">&times;</button>
    <button class="viewer-prev" type="button" aria-label="Foto anterior">&#10094;</button>
    <div class="viewer-content">
      <img class="viewer-image" src="" alt="">
      <p class="viewer-caption"></p>
      <p class="viewer-counter"></p>
    </div>
    <button class="viewer-next" type="button" aria-label="Próxima foto">&#10095;</button>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Carla Cardoso Uchôa (@carlauchoafotografia)</p>
  </footer>
